<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="amazon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FFC043" />
    </linearGradient>

    <linearGradient id="google-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#34A853" />
    </linearGradient>

    <linearGradient id="msft-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F25022" />
      <stop offset="100%" stop-color="#7FBA00" />
    </linearGradient>

    <linearGradient id="meta-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0668E1" />
      <stop offset="100%" stop-color="#A033FF" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-high" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animation Keyframes -->
    <style>
      .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
      
      .trend-meta {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 4s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }
      .trend-google {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 4s cubic-bezier(0.4, 0, 0.2, 1) 0.5s infinite alternate;
      }
      .trend-msft {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 4s cubic-bezier(0.4, 0, 0.2, 1) 1s infinite alternate;
      }
      .trend-amzn {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 4s cubic-bezier(0.4, 0, 0.2, 1) 1.5s infinite alternate;
      }

      @keyframes drawLine {
        0% { stroke-dashoffset: 1000; opacity: 0.2; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }

      .pulse-dot {
        animation: pulse 2s infinite ease-in-out;
      }
      .pulse-dot-2 {
        animation: pulse 2s infinite ease-in-out 0.5s;
      }
      .pulse-dot-3 {
        animation: pulse 2s infinite ease-in-out 1s;
      }
      .pulse-dot-4 {
        animation: pulse 2s infinite ease-in-out 1.5s;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.6); opacity: 1; filter: drop-shadow(0 0 8px currentColor); }
      }

      .badge-float {
        animation: floatAnim 3s ease-in-out infinite alternate;
      }
      .badge-float-rev {
        animation: floatAnim 3s ease-in-out 1.5s infinite alternate-reverse;
      }

      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }

      .shimmer-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />
  <rect width="1196" height="396" x="2" y="2" fill="none" stroke="#334155" stroke-width="1.5" rx="15" opacity="0.6" />

  <!-- Background Grid Lines -->
  <g opacity="0.4">
    <line x1="500" y1="80" x2="1140" y2="80" class="grid-line" />
    <line x1="500" y1="150" x2="1140" y2="150" class="grid-line" />
    <line x1="500" y1="220" x2="1140" y2="220" class="grid-line" />
    <line x1="500" y1="290" x2="1140" y2="290" class="grid-line" />
    <line x1="500" y1="350" x2="1140" y2="350" stroke="#334155" stroke-width="1.5" />

    <line x1="550" y1="70" x2="550" y2="350" class="grid-line" />
    <line x1="700" y1="70" x2="700" y2="350" class="grid-line" />
    <line x1="850" y1="70" x2="850" y2="350" class="grid-line" />
    <line x1="1000" y1="70" x2="1000" y2="350" class="grid-line" />
    <line x1="1130" y1="70" x2="1130" y2="350" class="grid-line" />
  </g>

  <!-- Year Labels -->
  <g fill="#64748B" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">
    <text x="550" y="372">2017</text>
    <text x="700" y="372">2020</text>
    <text x="850" y="372">2023</text>
    <text x="1000" y="372">2025E</text>
    <text x="1130" y="372">2026E</text>
  </g>

  <!-- Curves -->
  <path d="M 550 320 Q 700 290, 850 270 T 1000 160 T 1130 95" 
        fill="none" stroke="url(#meta-grad)" stroke-width="4" filter="url(#glow)" class="trend-meta" />
  
  <path d="M 550 330 Q 700 310, 850 260 T 1000 210 T 1130 155" 
        fill="none" stroke="url(#google-grad)" stroke-width="3.5" filter="url(#glow)" class="trend-google" />

  <path d="M 550 335 Q 700 320, 850 280 T 1000 230 T 1130 180" 
        fill="none" stroke="url(#msft-grad)" stroke-width="3.5" filter="url(#glow)" class="trend-msft" />

  <path d="M 550 340 Q 700 300, 850 290 T 1000 240 T 1130 205" 
        fill="none" stroke="url(#amazon-grad)" stroke-width="3.5" filter="url(#glow)" class="trend-amzn" />

  <!-- Active Data Points (2026E) -->
  <g transform="translate(1130, 95)">
    <circle r="6" fill="#A033FF" filter="url(#glow-high)" class="pulse-dot" />
    <circle r="3" fill="#FFFFFF" />
    <text x="-12" y="-12" fill="#C084FC" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="end">Meta 70.1%</text>
  </g>

  <g transform="translate(1130, 155)">
    <circle r="5" fill="#4285F4" filter="url(#glow-high)" class="pulse-dot-2" />
    <circle r="2.5" fill="#FFFFFF" />
    <text x="-12" y="-4" fill="#93C5FD" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="end">Google 42.6%</text>
  </g>

  <g transform="translate(1130, 180)">
    <circle r="5" fill="#F25022" filter="url(#glow-high)" class="pulse-dot-3" />
    <circle r="2.5" fill="#FFFFFF" />
    <text x="12" y="-2" fill="#FCA5A5" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="start">MSFT 34.9%</text>
  </g>

  <g transform="translate(1130, 205)">
    <circle r="5" fill="#FF9900" filter="url(#glow-high)" class="pulse-dot-4" />
    <circle r="2.5" fill="#FFFFFF" />
    <text x="12" y="14" fill="#FCD34D" font-size="11" font-family="sans-serif" font-weight="700" text-anchor="start">AMZN 26.7%</text>
  </g>

  <!-- Left Side: Title & Branding -->
  <g transform="translate(60, 0)">
    <!-- Pill Tag -->
    <g transform="translate(0, 65)" class="badge-float">
      <rect width="210" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="14" cy="14" r="4" fill="#10B981" />
      <text x="26" y="18" fill="#A5B4FC" font-size="12" font-family="sans-serif" font-weight="700" letter-spacing="0.5">AI INFRASTRUCTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#title-grad)" font-size="38" class="shimmer-text" filter="url(#glow)">
      Big Tech CapEx
    </text>
    <text x="0" y="185" fill="#FFFFFF" font-size="28" class="shimmer-text">
      &amp; Revenue Dynamics
    </text>

    <!-- Subtitle -->
    <text x="0" y="225" fill="#94A3B8" font-size="15" class="sub-text">
      Tracking hyperscale capital intensity &amp; the AI compute boom
    </text>
    <text x="0" y="248" fill="#64748B" font-size="13" class="sub-text">
      Amazon AWS · Alphabet Google · Microsoft Azure · Meta
    </text>

    <!-- Badges -->
    <g transform="translate(0, 280)">
      <g class="badge-float">
        <rect width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="52" y="22" fill="#38BDF8" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle">🐍 Python 3</text>
      </g>
      <g transform="translate(115, 0)" class="badge-float-rev">
        <rect width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="52" y="22" fill="#F472B6" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle">🐼 Pandas</text>
      </g>
      <g transform="translate(230, 0)" class="badge-float">
        <rect width="115" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="57" y="22" fill="#34D399" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle">📊 Matplotlib</text>
      </g>
    </g>

    <!-- Time Horizon -->
    <text x="0" y="355" fill="#475569" font-size="12" font-family="sans-serif" font-weight="600">
      TIME HORIZON: 2017 – 2026E (ESTIMATES)
    </text>
  </g>
</svg>