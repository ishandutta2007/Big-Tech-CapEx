er-spacing=".5">AI INFRASTRUCTURE</text></g><text x="0" y="145" fill="url(#title-grad)" class="shimmer-text" filter="url(#glow)" font-size="38" transform="translate(60, 0)">Big Tech CapEx</text><text x="0" y="185" fill="#FFF" class="shimmer-text" font-size="28" transform="translate(60, 0)">&amp; Revenue Dynamics</text><text x="0" y="225" fill="#94A3B8" class="sub-text" font-size="15" transform="translate(60, 0)">Tracking hyperscale capital intensity &amp; the AI compute boom</text><text x="0" y="248" fill="#64748B" class="sub-text" font-size="13" transform="translate(60, 0)">Amazon AWS · Alphabet Google · Microsoft Azure · Meta</text><g><g class="badge-float" transform="translate(60, 0) translate(0, 280)"><rect width="105" height="34" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="52" y="22" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">🐍 Python 3</text></g><g class="badge-float-rev" transform="translate(60, 0) translate(0, 280) translate(115, 0)"><rect width="105" height="34" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="52" y="22" fill="#F472B6" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">🐼 Pandas</text></g><g class="badge-float" transform="translate(60, 0) translate(0, 280) translate(230, 0)"><rect width="115" height="34" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="57" y="22" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">📊 Matplotlib</text></g></g><text x="0" y="355" fill="#475569" font-family="sans-serif" font-size="12" font-weight="600" transform="translate(60, 0)">TIME HORIZON: 2017 – 2026E (ESTIMATES)</text></g></svg>