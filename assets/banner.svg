<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a10"/></linearGradient><linearGradient id="amazon-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#F90"/><stop offset="100%" stop-color="#FFC043"/></linearGradient><linearGradient id="google-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#4285F4"/><stop offset="100%" stop-color="#34A853"/></linearGradient><linearGradient id="msft-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#F25022"/><stop offset="100%" stop-color="#7FBA00"/></linearGradient><linearGradient id="meta-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0668E1"/><stop offset="100%" stop-color="#A033FF"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60A5FA"/><stop offset="50%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#F472B6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-high" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes drawLine{0%{stroke-dashoffset:1000;opacity:.2}50%{opacity:1}}@keyframes pulse{0%{transform:scale(1);opacity:.8}50%{transform:scale(1.6);opacity:1;filter:drop-shadow(0 0 8px currentColor)}}@keyframes floatAnim{0%{transform:translateY(0)}}.grid-line{stroke:#1e293b;stroke-width:1;stroke-dasharray:4 4}.trend-amzn,.trend-google{stroke-dasharray:1000;stroke-dashoffset:1000}.trend-meta{animation:drawLine 4s cubic-bezier(.4,0,.2,1) infinite alternate}.trend-meta,.trend-msft{stroke-dasharray:1000;stroke-dashoffset:1000}.trend-google{animation:drawLine 4s cubic-bezier(.4,0,.2,1) .5s infinite alternate}.trend-msft{animation:drawLine 4s cubic-bezier(.4,0,.2,1) 1s infinite alternate}.trend-amzn{animation:drawLine 4s cubic-bezier(.4,0,.2,1) 1.5s infinite alternate}.pulse-dot{animation:pulse 2s infinite ease-in-out}.pulse-dot-2{animation:pulse 2s infinite ease-in-out .5s}.pulse-dot-3{animation:pulse 2s infinite ease-in-out 1s}.pulse-dot-4{animation:pulse 2s infinite ease-in-out 1.5s}.badge-float{animation:floatAnim 3s ease-in-out infinite alternate}.badge-float-rev{animation:floatAnim 3s ease-in-out 1.5s infinite alternate-reverse}.shimmer-text,.sub-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif;font-weight:800}.sub-text{font-weight:500}</style></defs><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><rect width="1196" height="396" x="2" y="2" fill="none" stroke="#334155" stroke-width="1.5" opacity=".6" rx="15"/><g opacity=".4"><line x1="500" x2="1140" y1="80" y2="80" class="grid-line"/><line x1="500" x2="1140" y1="150" y2="150" class="grid-line"/><line x1="500" x2="1140" y1="220" y2="220" class="grid-line"/><line x1="500" x2="1140" y1="290" y2="290" class="grid-line"/><line x1="500" x2="1140" y1="350" y2="350" stroke="#334155" stroke-width="1.5"/><line x1="550" x2="550" y1="70" y2="350" class="grid-line"/><line x1="700" x2="700" y1="70" y2="350" class="grid-line"/><line x1="850" x2="850" y1="70" y2="350" class="grid-line"/><line x1="1000" x2="1000" y1="70" y2="350" class="grid-line"/><line x1="1130" x2="1130" y1="70" y2="350" class="grid-line"/></g><g fill="#64748B" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle"><text x="550" y="372">2017</text><text x="700" y="372">2020</text><text x="850" y="372">2023</text><text x="1000" y="372">2025E</text><text x="1130" y="372">2026E</text></g><path fill="none" stroke=